<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="author" content="سار">
  <meta name="theme-color" content="#00778B">

  <!-- وصف الصفحة لمحركات البحث -->
  <meta
    name="description"
    content="لوحة تحكم سار لإدارة ومتابعة نقل الصكوك والتعديات ."
    id="meta-description"
  >

  <!-- Open Graph: معلومات مشاركة الرابط -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="سار">
  <meta property="og:locale" content="ar_SA">
  <meta property="og:title" content="الرئيسية | سار" id="og-title">
  <meta
    property="og:description"
    content="لوحة تحكم سار لإدارة ومتابعة الأعمال."
    id="og-description"
  >
  <meta property="og:url" content="" id="og-url">
  <meta property="og:image" content="" id="og-image">

  <!-- Favicon: شعار تبويب المتصفح -->
  <link rel="icon" type="image/png" href="assets/images/sar-logo.png">
  <link rel="apple-touch-icon" href="assets/images/sar-logo-s.png">



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

    <title>نقل الصكوك</title>
    <link rel="stylesheet" href="css/style.css">

  <script src="js/main.js" defer></script>
</head>
<body>
      <!-- تحميل النافبار هنا -->
  <div id="navbar-container"></div>

  <!-- محتوى الصفحة -->
    <main class="main-content">
    <header class="page-header">
      <div>
        <p class="eyebrow">لوحة التحكم</p>
        <h1> التعديات</h1>
      </div>
      <span class="updated-label"><span class="status-dot"></span> مؤشرات مباشرة من البيانات</span>
    </header>

    <!-- الحاوية الرئيسية للـ KPI فقط؛ يتم إنشاء البطاقات من ملف JavaScript -->
    <section class="kpi-section" aria-labelledby="kpi-heading">
      <div class="section-heading">
        <div>
          <h2 id="kpi-heading">المؤشرات الرئيسية</h2>
          <p>اختر أي بطاقة لعرض تفاصيل طريقة احتساب المؤشر.</p>
        </div>
        <span id="record-count" class="record-count">جارٍ تحميل البيانات...</span>
      </div>
      <div id="kpi-container" class="kpi-grid" aria-live="polite"></div>
      <p id="data-note" class="data-note" hidden></p>
      <p id="load-error" class="load-error" role="alert" hidden></p>
    </section>
  </main>

</body>
</html>
