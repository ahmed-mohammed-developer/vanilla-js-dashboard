<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="سار">
    <meta name="theme-color" content="#00778B">
    
    <!-- Open Graph: معلومات مشاركة الرابط -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="سار">
    <meta property="og:locale" content="ar_SA">
    <meta property="og:title" content="التعديات | سار" id="og-title">
    <meta property="og:description" content="لوحة تحكم التعديات." id="og-description">
    <meta property="og:url" content="https://real-estate-surveving-land-management.netlify.app/encroachments.html" id="og-url">
    <meta property="og:image" content="assets/images/sar-logo.png" id="og-image">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/sar-logo.png">
    <link rel="apple-touch-icon" href="assets/images/sar-logo-s.png">

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>التعديات | سار</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" type="module" defer></script>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <p class="eyebrow">لوحة تحكم</p>
                <h1>التعديات</h1>
            </div>
        </header>

        <!-- المؤشرات الرئيسية -->
        <section class="kpi-section" aria-labelledby="kpi-heading">
            <div class="section-heading">
                <div>
                    <h2 id="kpi-heading">المؤشرات الرئيسية</h2>
                </div>
            </div>
            <div id="kpi-container" class="kpi-grid" aria-live="polite"></div>
        </section>

        <!-- قسم الرسوم البيانية -->
        <section class="charts-section">

            <!-- الرسم البياني الأول: تصنيف التعديات -->
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <h2>تصنيف التعديات</h2>
                    </div>
                    <button class="reset-filter">إزالة الفلتر</button>
                </div>
                <div class="chart-wrapper">
                    <canvas id="encroachmentsChart"></canvas>
                    <div class="chart-center">
                        <strong id="chart-total">0</strong>
                        <span>تعدي</span>
                    </div>
                </div>
                <!-- تفاصيل التصنيف -->
                <div id="encroachments-legend-details" class="chart-details-grid"></div>
            </div>

            <!-- الرسم البياني الثاني: حالة التعدي -->
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <h2>حالة التعدي</h2>
                    </div>
                    <button class="reset-filter">إزالة الفلتر</button>
                </div>

                <div class="chart-wrapper">
                    <canvas id="statusChart"></canvas>
                    <div class="chart-center">
                        <strong id="status-total">0</strong>
                        <span>تعدي</span>
                    </div>
                </div>
                <!-- تفاصيل حالة التعدي -->
                <div id="status-legend-details" class="chart-details-grid"></div>
            </div>

            <!-- الرسم البياني الثالث: حالة القضية -->
           <!-- دونات حالة القضية -->
<div class="chart-card">
  <div class="chart-header">
    <div>
      <h2>حالة القضية</h2>
    </div>
    <button class="reset-filter">إزالة الفلتر</button>
  </div>

  <div class="chart-wrapper">
    <canvas id="caseChart"></canvas>
    <div class="chart-center">
      <strong id="case-total">0</strong>
      <span>حالة القضية</span>
    </div>
  </div>

  <!-- حاوية تفاصيل حالة القضية -->
  <div id="case-legend-details" class="chart-details-grid"></div>
</div>

        </section>

        <p id="load-error" class="load-error" role="alert" hidden></p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
